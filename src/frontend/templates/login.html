<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Northstar</title>
  <style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #172033;
        background: #f4f6fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
    }
    a { color: #4968d8; text-decoration: none; }
    .brand { font-size: 22px; font-weight: 800; }
    .brand span { color: #4968d8; }
    .muted { color: #68738a; line-height: 1.7; }
    .card {
        padding: 25px; background: white;
        border: 1px solid #e4e9f2; border-radius: 14px;
        box-shadow: 0 8px 24px #17203308;
    }
    .btn {
        display: inline-block; border: 0; border-radius: 8px;
        padding: 14px 20px; background: #4968d8;
        color: white; font-weight: bold; cursor: pointer;
    }
    label { display: block; margin: 20px 0 8px; font-weight: bold; font-size: 14px; }
    input {
        width: 100%; padding: 13px;
        border: 1px solid #d9dfeb; border-radius: 8px;
        font-size: 15px;
    }
    .login-card { width: 100%; max-width: 430px; padding: 38px; }
    h1 { margin: 30px 0 8px; font-size: 30px; }
    .submit { width: 100%; margin-top: 25px; }
    .back { display: block; text-align: center; margin-top: 23px; }
    .error {
        margin-top: 20px; padding: 12px; border-radius: 8px;
        background: #fff0f0; color: #a52d2d; font-size: 14px;
    }
    .success {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
        font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card login-card">
    <div class="brand">Northstar<span>.</span></div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in with your employee account to continue.</p>
    {% if error %}
    <div class="{{ 'success' if request.args.get('success') == '1' else 'error' }}">
    {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username"
             autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <button class="btn submit" type="submit">Sign in</button>
    </form>
    <a class="back" href="/">← Back to home</a>
  </main>
</body>
</html>
